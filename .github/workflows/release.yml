# Build hdrrec on every push to main and publish it as the GitHub release "v<VERSION>".
#
# - The version comes from the VERSION file. A push without a version bump rebuilds and replaces
#   the release of the current version (its tag is moved to the new commit); bump VERSION to
#   start a new release.
# - Release assets: hdrrec-<VERSION>-win64.zip (executables, README, licenses) and the FFmpeg
#   source archive the executables were built from (LGPL source offer).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            tar
            curl

      - name: Build
        run: bash scripts/build_hdrrec.sh

      - name: Package
        run: bash scripts/package_release.sh "$(tr -d '\r\n' < VERSION)"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $assets = @("dist/hdrrec-$version-win64.zip", "dist/ffmpeg-n8.1.3-source.tar.gz")
          $notes = @"
          hdrrec $version (built from $env:GITHUB_SHA)

          - ``hdrrec-$version-win64.zip``: hdrrec.exe, hdrrec_gui.exe, README, licenses. Extract and run ``hdrrec_gui.exe``.
          - ``ffmpeg-n8.1.3-source.tar.gz``: source code of the FFmpeg version statically linked into hdrrec.exe (LGPL 2.1+). See THIRD_PARTY_NOTICES.md.
          "@
          # replace the release of this version so that the tag always points at the built commit
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --cleanup-tag --yes }
          $global:LASTEXITCODE = 0
          gh release create $tag @assets --target $env:GITHUB_SHA --title "hdrrec $version" --notes $notes
